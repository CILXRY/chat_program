[package]
name = "nebula-desktop"
version = "0.3.0"
description = "Nebula Windows desktop client"
authors = ["CILXRY"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "nebula_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
tokio = { version = "1", features = ["sync", "net", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
rand = "0.9"
windows-capture = "2.0.1"
wasapi = "0.26"
half = "2"
url = "2"
sha2 = "0.10"
rayon = "1"
windows = { version = "0.62", features = [
  "Win32",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
